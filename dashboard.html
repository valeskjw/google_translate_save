<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocabulary Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
    }

    .dashboard-container {
      display: flex;
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .sidebar {
      width: 320px;
      flex-shrink: 0;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      height: fit-content;
      position: sticky;
      top: 24px;
    }

    .main-content {
      flex: 1;
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 12px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #f8f9fa;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #e9ecef;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #495057;
      font-weight: 500;
    }

    .filter-group input[type="date"] {
      padding: 4px 8px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
    }

    .filter-btn {
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset {
      background-color: #6c757d;
      color: white;
    }

    textarea {
      width: 100%;
      height: 90px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }

    .translation-result {
      min-height: 48px;
      background-color: #e7f1ff;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      font-size: 14px;
      color: #004085;
      word-break: break-word;
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background-color: #0073e6; color: white; }
    .btn-success { background-color: #28a745; color: white; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
    }

    th {
      background-color: #f8f9fa;
      color: #495057;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) { background-color: #fcfcfc; }
    tr:hover { background-color: #f1f3f5; }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e9ecef;
    }

    .nav-btn {
      background: #0073e6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .nav-btn:disabled { background: #ced4da; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="sidebar">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-size: 13px;">
        <span id="source-lang-label">English</span>
        <button id="swap-lang-btn" style="cursor: pointer; border: none; background: none; font-size: 14px;">⇄</button>
        <span id="target-lang-label">Spanish</span>
      </div>
      <textarea id="translate-input" placeholder="Enter word or phrase..."></textarea>
      <div id="translation-output" class="translation-result"><em>Translation output...</em></div>
      <button id="translate-btn" class="btn btn-primary">Translate</button>
      <button id="save-btn" class="btn btn-success" disabled>💾 Save to Dictionary</button>
    </div>

    <div class="main-content">
      <div class="header-row">
        <div>
          <h2 style="margin: 0; color: #111;">📚 Saved Dictionary</h2>
          <span id="word-count" style="background: #e7f1ff; color: #0073e6; font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-top: 4px; display: inline-block;">0 words total</span>
        </div>

        <button id="export-anki-btn" style="background-color: #6f42c1; color: white; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer;">
          Export for Anki
        </button>
      </div>

      <div class="filter-bar">
        <div class="filter-group">
          <label for="start-date">Start Date:</label>
          <input type="date" id="start-date">
        </div>
        <div class="filter-group">
          <label for="end-date">End Date:</label>
          <input type="date" id="end-date">
        </div>
        <button id="reset-filter-btn" class="filter-btn btn-reset">Reset Filter</button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width: 35%;">English</th>
            <th style="width: 35%;">Spanish</th>
            <th style="width: 20%;">Timestamp</th>
            <th style="width: 10%;"></th>
          </tr>
        </thead>
        <tbody id="dictionary-list"></tbody>
      </table>

      <div class="pagination">
        <button id="prev-page" class="nav-btn">← Previous Page</button>
        <span id="page-indicator" style="font-weight: 600;">Page 1</span>
        <button id="next-page" class="nav-btn">Next Page →</button>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
